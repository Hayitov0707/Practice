name: .NET Core CI

on:
  push:
    branches:
      - main
      - task01
      - task02
      - task03
      - task04
      - task05
      - task07
      - task09
      - task10
      - task11
      - task13
      - task14
      - task15
      - task17
      - task18
      - task19
  pull_request:
    branches:
      - main
      - task01
      - task02
      - task03
      - task04
      - task05
      - task07
      - task09
      - task10
      - task11
      - task13
      - task14
      - task15
      - task17
      - task18
      - task19

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Active Task Tests
      run: |
        if [ -f practice2026/task19.slnx ]; then
          dotnet restore practice2026/task19.slnx
          dotnet build practice2026/task19.slnx --no-restore --configuration Release
          dotnet test practice2026/task19.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task18.slnx ]; then
          dotnet restore practice2026/task18.slnx
          dotnet build practice2026/task18.slnx --no-restore --configuration Release
          dotnet test practice2026/task18.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task17.slnx ]; then
          dotnet restore practice2026/task17.slnx
          dotnet build practice2026/task17.slnx --no-restore --configuration Release
          dotnet test practice2026/task17.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task15.slnx ]; then
          dotnet restore practice2026/task15.slnx
          dotnet build practice2026/task15.slnx --no-restore --configuration Release
          dotnet test practice2026/task15.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task14.slnx ]; then
          dotnet restore practice2026/task14.slnx
          dotnet build practice2026/task14.slnx --no-restore --configuration Release
          dotnet test practice2026/task14.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task13.slnx ]; then
          dotnet restore practice2026/task13.slnx
          dotnet build practice2026/task13.slnx --no-restore --configuration Release
          dotnet test practice2026/task13.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task05.slnx ]; then
          dotnet restore practice2026/task05.slnx
          dotnet build practice2026/task05.slnx --no-restore --configuration Release
          dotnet test practice2026/task05.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task04.slnx ]; then
          dotnet restore practice2026/task04.slnx
          dotnet build practice2026/task04.slnx --no-restore --configuration Release
          dotnet test practice2026/task04.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task03.slnx ]; then
          dotnet restore practice2026/task03.slnx
          dotnet build practice2026/task03.slnx --no-restore --configuration Release
          dotnet test practice2026/task03.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task02.slnx ]; then
          dotnet restore practice2026/task02.slnx
          dotnet build practice2026/task02.slnx --no-restore --configuration Release
          dotnet test practice2026/task02.slnx --no-restore --configuration Release --verbosity normal
        elif [ -f practice2026/task01.slnx ]; then
          dotnet restore practice2026/task01.slnx
          dotnet build practice2026/task01.slnx --no-restore --configuration Release
          dotnet test practice2026/task01.slnx --no-restore --configuration Release --verbosity normal
        else
          dotnet restore practice2026/practice2025.slnx
          dotnet build practice2026/practice2025.slnx --no-restore --configuration Release
          dotnet test practice2026/practice2025.slnx --no-restore --configuration Release --verbosity normal
        fi
